<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComzxCloud - Cloud Storage</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <p>ComzxCloud</p>
    </div>

    <!-- Auth Container -->
    <div id="authContainer" class="auth-container hidden">
        <!-- Login Form -->
        <div id="loginForm" class="auth-form active">
            <div class="auth-header">
                <h1>ComzxCloud</h1>
                <p>Login ke Cloud Anda</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div class="auth-divider">
                <span>atau</span>
            </div>
            <button type="button" class="btn-google" onclick="handleGoogleLogin()">
                <i class="fab fa-google"></i> Login dengan Google
            </button>
            <p class="auth-toggle">
                Belum punya akun? <a href="#" onclick="toggleForm(); return false;">Daftar</a>
            </p>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="auth-form">
            <div class="auth-header">
                <h1>ComzxCloud</h1>
                <p>Buat Akun Baru</p>
            </div>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerName">Nama Lengkap</label>
                    <input type="text" id="registerName" required placeholder="Nama Anda">
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Daftar</button>
            </form>
            <p class="auth-toggle">
                Sudah punya akun? <a href="#" onclick="toggleForm(); return false;">Login</a>
            </p>
        </div>
    </div>

    <!-- App Container -->
    <div id="appContainer" class="app-container hidden">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">
                <div class="logo">
                    <i class="fas fa-cloud"></i>
                    <span>ComzxCloud</span>
                </div>
            </div>
            <div class="navbar-right">
                <button class="btn-instagram" onclick="toggleInstagramMenu()" title="Follow Instagram">
                    <i class="fab fa-instagram"></i>
                </button>
                <div id="instagramMenu" class="instagram-menu hidden">
                    <a href="https://instagram.com/fadhil.czx" target="_blank">
                        <i class="fab fa-instagram"></i>
                        <span>@fadhil.czx</span>
                    </a>
                </div>

                <button class="btn-user" onclick="toggleUserMenu()">
                    <i class="fas fa-user-circle"></i>
                </button>
                <div id="userMenu" class="user-menu hidden">
                    <div class="user-info">
                        <div id="userNameDisplay" class="user-name">User</div>
                        <div id="userEmailDisplay" class="user-email">user@email.com</div>
                    </div>
                    <hr>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">
                    <i class="fas fa-th"></i> Semua
                </button>
                <button class="tab-btn" data-tab="photos" onclick="switchTab('photos')">
                    <i class="fas fa-image"></i> Foto
                </button>
                <button class="tab-btn" data-tab="videos" onclick="switchTab('videos')">
                    <i class="fas fa-video"></i> Video
                </button>
                <button class="tab-btn" data-tab="notes" onclick="switchTab('notes')">
                    <i class="fas fa-sticky-note"></i> Catatan
                </button>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- All Items Tab -->
                <div id="allContent" class="content-tab active">
                    <div id="allItemsList" class="items-grid"></div>
                </div>

                <!-- Photos Tab -->
                <div id="photosContent" class="content-tab">
                    <div id="photosGrid" class="items-grid"></div>
                </div>

                <!-- Videos Tab -->
                <div id="videosContent" class="content-tab">
                    <div id="videosGrid" class="items-grid"></div>
                </div>

                <!-- Notes Tab -->
                <div id="notesContent" class="content-tab">
                    <div id="notesList" class="notes-list"></div>
                </div>
            </div>

            <!-- Upload Button (Center) -->
            <button class="upload-button" onclick="toggleUploadMenu()" title="Upload atau Buat">
                <i class="fas fa-plus"></i>
            </button>

            <!-- Upload Menu -->
            <div id="uploadMenu" class="upload-menu hidden">
                <button class="upload-option" onclick="uploadLinkPrompt()">
                    <i class="fas fa-link"></i>
                    <span>Upload Link</span>
                </button>
                <button class="upload-option" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-image"></i>
                    <span>Foto/Video</span>
                </button>
                <input type="file" id="fileInput" multiple accept="image/*,video/*" onchange="handleFileUpload(event)" style="display: none;">
                <button class="upload-option" onclick="createNotePrompt()">
                    <i class="fas fa-sticky-note"></i>
                    <span>Catatan</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
